name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  jvm-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: ./gradlew -PjvmOnly=true test --stacktrace
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      # ubuntu-latest ships the Android SDK at $ANDROID_HOME; setup-android@v3 currently fails on 'tools'.
      - run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Build APK (shared key -> installs over previous builds)
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug -PbuildNumber=${{ github.run_number }} --continue 2>&1 | tee build.log || {
            echo "::group::COMPILE ERRORS"; grep -E "^e: |error: |What went wrong|Caused by" -A6 build.log | grep -v "^> Task" | head -200; echo "::endgroup::"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log-${{ github.run_number }}
          path: build.log
      - name: Show native libs in APK
        run: unzip -l app/build/outputs/apk/debug/*.apk | grep -E "\.so$" || true
      - uses: actions/upload-artifact@v4
        with:
          name: exynoslm-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
