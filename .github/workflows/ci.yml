name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  jvm-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: ./gradlew -PjvmOnly=true test --stacktrace
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - name: Build APK (shared key -> installs over previous builds)
        run: ./gradlew :app:assembleDebug -PbuildNumber=${{ github.run_number }} --stacktrace
      - name: Show native libs in APK
        run: unzip -l app/build/outputs/apk/debug/*.apk | grep -E "\.so$" || true
      - uses: actions/upload-artifact@v4
        with:
          name: exynoslm-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
